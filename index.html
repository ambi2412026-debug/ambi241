<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon App Performante</title>

  <!-- ✅ 1. CSS CRITIQUE INLINE → FCP rapide, pas de render-blocking -->
  <style>
    /* === RESET & BASE === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --accent: #00e5ff;
      --accent2: #ff3d71;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Above-the-fold uniquement */
    header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ffffff0f;
      background: var(--surface);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem 2rem;
      gap: 1.5rem;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 480px;
      line-height: 1.6;
    }
  </style>

  <!-- ✅ 2. POLICES : preconnect → évite DNS lookup tardif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ✅ 3. CSS NON-CRITIQUE chargé en async (ne bloque pas le rendu) -->
  <link rel="preload" href="styles.css" as="style" onload="this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="styles.css" /></noscript>

  <!-- ✅ 4. Polices async -->
  <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
        as="style"
        onload="this.rel='stylesheet'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
          rel="stylesheet" />
  </noscript>
</head>

<body>

  <header>
    <div class="logo">⚡ PerfApp</div>
    <div id="status-badge" class="badge badge--connecting">Connexion…</div>
  </header>

  <main class="hero">
    <h1>Rapide.<br/><span>Vraiment</span> rapide.</h1>
    <p>Architecture optimisée : CSS critique inline, JS différé, WebSocket au lieu de polling.</p>
    <button class="btn" id="load-dashboard">Ouvrir le Dashboard</button>
  </main>

  <!-- Section chargée dynamiquement -->
  <section id="dashboard" hidden></section>

  <div id="toast-container"></div>

  <!-- ✅ 5. JS DIFFÉRÉ (defer) → ne bloque pas le parsing HTML (TTI rapide) -->
  <script defer src="app.js"></script>

</body>
</html>
