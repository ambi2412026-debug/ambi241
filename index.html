<style>
:root{
  --player-h: 0px;   /* mis à jour dynamiquement par JS quand le lecteur est visible */
  --nav-h: 54px;     /* hauteur bottom-nav */
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#1a0a28;--surface:#230d35;--surface2:#2c1040;--border:rgba(255,45,155,0.15);--text:#fff0f8;--muted:#b088c0;--pink:#ff2d9b;--cyan:#00e5ff;--amber:#ffd700;--green:#00ffaa;--red:#ff4466;--purple:#7b2cbf;
}
html{overflow-x:hidden;max-width:100vw;scrollbar-gutter:stable;overflow-y:scroll;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--player-h));padding-top:116px;max-width:100%;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 10%,rgba(255,45,155,0.12) 0%,transparent 50%),radial-gradient(ellipse at 90% 30%,rgba(0,229,255,0.10) 0%,transparent 50%);pointer-events:none;z-index:0;}
/* Optimisation GPU pour les éléments animés */
.live-dot,.heb-dot,.dispo-updated-dot,.cef-live,.hero-eyebrow-dot{will-change:opacity,transform;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
main, section, .pane, .tab-pane, [role="tabpanel"] {
  width: 100%;
  overflow-x: hidden;
}
.soc-tabs, .socpub-filter-row, .igm-steps, .header-guide-bar,
.demo-nav-profil, .af-filter-row {
  overflow-x: auto !important;
}
