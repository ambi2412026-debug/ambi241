<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AMBI241 - Trouvez l'ambiance des bars et restaurants de Libreville en temps réel">
<meta name="theme-color" content="#1a0a28">
<title>AMBI241 - Ambiance Libreville en Direct</title>

<!-- Preconnect (performance DNS + TLS) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">

<!-- Polices : chargement non-bloquant -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</noscript>

<style>
:root {
  --bg: #1a0a28;
  --surface: #230d35;
  --border: rgba(255, 45, 155, 0.15);
  --text: #fff0f8;
  --muted: #b088c0;
  --pink: #ff2d9b;
  --cyan: #00e5ff;
  --green: #00ffaa;
  --red: #ff4466;
}

/* ══ RESET & BASE ══ */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  overflow-x: hidden;
  max-width: 100vw;
  scrollbar-gutter: stable;
  overflow-y: scroll;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  width: 100%;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 10% 10%, rgba(255, 45, 155, 0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 30%, rgba(0, 229, 255, 0.10) 0%, transparent 50%);
  pointer-events: none;
  z-index: -1;
}

main {
  max-width: 100%;
  width: 100%;
  padding: 1.5rem;
  padding-top: 100px;
  margin-bottom: 80px;
}

/* ══ HEADER ══ */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  z-index: 50;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.header-left {
  font-family: 'Syne', sans-serif;
  font-size: 1.3rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-right { display: flex; gap: 0.8rem; align-items: center; }

.live-status {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--green);
}

.live-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

/* ══ BUTTONS ══ */
.btn {
  padding: 0.6rem 1.2rem;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 45, 155, 0.1);
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.85rem;
  transition: border-color 0.3s, background 0.3s;
  font-family: 'DM Sans', sans-serif;
}

.btn:hover {
  border-color: var(--pink);
  background: rgba(255, 45, 155, 0.2);
}

.btn:active { transform: scale(0.97); }

/* ══ LAYOUT ══ */
.container { max-width: 1200px; margin: 0 auto; }

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.2rem;
  margin-bottom: 2rem;
}

/* ══ CARDS ══ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.2rem;
  cursor: pointer;
  transition: border-color 0.3s, box-shadow 0.3s;
  position: relative;
  overflow: hidden;
  animation: fadeIn 0.3s ease-out;
  animation-fill-mode: both;
}

.card:hover {
  border-color: var(--pink);
  box-shadow: 0 8px 24px rgba(255, 45, 155, 0.2);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.8rem;
}

.card-title { font-weight: 700; font-size: 1.1rem; color: var(--text); }

.card-type {
  font-size: 0.7rem;
  background: rgba(0, 255, 170, 0.1);
  color: var(--green);
  padding: 0.3rem 0.6rem;
  border-radius: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.card-meta {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 0.8rem;
  flex-wrap: wrap;
  font-size: 0.8rem;
  color: var(--muted);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.3rem 0.6rem;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 6px;
}

.card-desc {
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 0.8rem;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.ambiance-gauge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.gauge-bar {
  flex: 1;
  height: 8px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
}

.gauge-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--pink));
  border-radius: 4px;
  transition: width 0.6s ease-out;
}

.gauge-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--pink);
  min-width: 60px;
  text-align: right;
}

/* ══ SEARCH ══ */
.search-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1.5rem;
  display: flex;
  gap: 0.8rem;
  flex-wrap: wrap;
  align-items: center;
}

.search-input {
  flex: 1;
  min-width: 200px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.7rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  transition: border-color 0.3s, background 0.3s;
}

.search-input::placeholder { color: var(--muted); }

.search-input:focus {
  outline: none;
  border-color: var(--pink);
  background: rgba(255, 45, 155, 0.05);
}

.filter-select {
  padding: 0.7rem 0.8rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  min-width: 150px;
  transition: border-color 0.3s;
}

.filter-select option { background: var(--surface); color: var(--text); }

.filter-select:focus { outline: none; border-color: var(--pink); }

.results-count {
  font-size: 0.8rem;
  color: var(--muted);
  padding: 0.4rem 0;
  white-space: nowrap;
}

/* ══ MAINTENANCE ══ */
.maintenance-banner {
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 68, 102, 0.1));
  border: 1px solid rgba(255, 215, 0, 0.3);
  border-radius: 10px;
  padding: 1.5rem;
  text-align: center;
  margin-bottom: 2rem;
  display: none;
}

.maintenance-banner.active { display: block; }
.maintenance-title { font-weight: 700; font-size: 1.2rem; color: var(--pink); margin-bottom: 0.5rem; }
.maintenance-text { color: var(--muted); font-size: 0.9rem; }

/* ══ EMPTY / LOADING ══ */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
  grid-column: 1 / -1;
}

.empty-icon { font-size: 3rem; margin-bottom: 1rem; }

.spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(255, 45, 155, 0.2);
  border-top-color: var(--pink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 1rem;
}

/* ══ FOOTER ══ */
footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 1.5rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 3rem;
}

/* ══ RESPONSIVE ══ */
@media (max-width: 768px) {
  header { flex-wrap: wrap; padding: 0.8rem 1rem; gap: 0.5rem; }
  main { padding: 1rem; padding-top: 120px; }
  .section-title { font-size: 1.4rem; }
  .grid { grid-template-columns: 1fr; }
  .search-box { flex-direction: column; }
  .search-input, .filter-select { width: 100%; min-width: unset; }
}

/* ══ ANIMATIONS ══ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.85); }
}

/* Décalage progressif des cartes pour effet stagger */
.grid .card:nth-child(1)  { animation-delay: 0.00s; }
.grid .card:nth-child(2)  { animation-delay: 0.05s; }
.grid .card:nth-child(3)  { animation-delay: 0.10s; }
.grid .card:nth-child(4)  { animation-delay: 0.15s; }
.grid .card:nth-child(5)  { animation-delay: 0.20s; }
.grid .card:nth-child(6)  { animation-delay: 0.25s; }
.grid .card:nth-child(n+7){ animation-delay: 0.30s; }

.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--green);
  font-size: 0.75rem;
  font-weight: 700;
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left" aria-label="AMBI241">🎆 AMBI241</div>
  <div class="header-right">
    <span class="live-status" id="liveStatus" style="display:none;">
      <span class="live-dot" aria-hidden="true"></span>
      EN DIRECT
    </span>
    <button class="btn" onclick="location.reload()" aria-label="Actualiser">🔄</button>
  </div>
</header>

<main>
  <div class="container">

    <!-- MAINTENANCE BANNER -->
    <div id="maintenanceBanner" class="maintenance-banner" role="alert">
      <div class="maintenance-title">⚠️ Mode Maintenance</div>
      <div class="maintenance-text">L'application est en maintenance. Veuillez revenir bientôt.</div>
    </div>

    <div id="appContent">
      <!-- SEARCH & FILTERS -->
      <div class="search-box" role="search">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="🔍 Rechercher un établissement..."
          oninput="filterEstablishments()"
          aria-label="Rechercher un établissement"
        >
        <select id="typeFilter" class="filter-select" onchange="filterEstablishments()" aria-label="Filtrer par type">
          <option value="">Tous les types</option>
          <option value="restaurant">🍽️ Restaurants</option>
          <option value="bar">🍸 Bars</option>
          <option value="nightclub">🎉 Boîtes de nuit</option>
          <option value="cafe">☕ Cafés</option>
          <option value="hotel">🏨 Hôtels</option>
          <option value="disco">💿 Discothèques</option>
          <option value="pub">🍺 Pubs</option>
          <option value="lounge">🛋️ Lounges</option>
          <option value="poker">♠️ Poker</option>
        </select>
        <select id="neighborhoodFilter" class="filter-select" onchange="filterEstablishments()" aria-label="Filtrer par quartier">
          <option value="">Tous les quartiers</option>
          <option value="Centre-ville">Centre-ville</option>
          <option value="Ancienne Gare">Ancienne Gare</option>
          <option value="Vieux Port">Vieux Port</option>
          <option value="Quartier Chinois">Quartier Chinois</option>
          <option value="Batéké">Batéké</option>
          <option value="Akébé">Akébé</option>
          <option value="Nkembo">Nkembo</option>
          <option value="Autre">Autre</option>
        </select>
        <span class="results-count" id="resultsCount" aria-live="polite"></span>
      </div>

      <!-- ÉTABLISSEMENTS -->
      <h2 class="section-title">🏢 Établissements</h2>
      <div id="establishmentsList" class="grid" aria-live="polite">
        <div class="empty-state">
          <div class="spinner"></div>
          <div>Connexion en cours...</div>
        </div>
      </div>

      <!-- HAPPENINGS -->
      <h2 class="section-title">🎉 Happenings en Direct</h2>
      <div id="happeningsList" class="grid" aria-live="polite">
        <div class="empty-state">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<footer>
  <p>AMBI241 © 2024 — Découvrez l'ambiance de Libreville en temps réel</p>
</footer>

<!-- Firebase Compat v10.12.2 (stable, sécurisée) -->
<!-- ✅ Chargé en dernier pour ne pas bloquer le rendu -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- ✅ PAS de admin-config.js ici (sécurité : config admin non exposée publiquement) -->

<script>
'use strict';

// ══ CONFIG FIREBASE (publique par design — sécurité = Firestore Security Rules) ══
const FIREBASE_CONFIG = {
apiKey: "AIzaSyCx3hD28Lb9EtUrawHbTnM-6vmXdgO1ABw",
authDomain: "ambi241.firebaseapp.com",
projectId: "ambi241",
storageBucket: "ambi241.firebasestorage.app",
messagingSenderId: "422590051382",
appId: "1:422590051382:web:fe05eaf701a6f704c2d497"

// ══ ÉTAT ══
let db = null;
let allEstablishments = [];
let allHappenings    = [];

// ══ UTILITAIRES ══
function escapeHTML(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return String(text || '').replace(/[&<>"']/g, m => map[m]);
}

function getTypeEmoji(type) {
  const emojis = {
    restaurant: '🍽️', bar: '🍸', nightclub: '🎉', cafe: '☕',
    hotel: '🏨', disco: '💿', pub: '🍺', lounge: '🛋️', poker: '♠️'
  };
  return emojis[type] || '📍';
}

function getAmbianceLabel(level) {
  return { 1: 'Très Calme', 2: 'Calme', 3: 'Modéré', 4: 'Animé', 5: '🔥 CHAUD' }[level] || 'N/A';
}

// ══ INITIALISATION ══
function initApp() {
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();

    // Activer cache local Firestore (offline-first)
    db.enablePersistence({ synchronizeTabs: true }).catch(e => {
      if (e.code !== 'failed-precondition' && e.code !== 'unimplemented') {
        console.warn('Persistence error:', e);
      }
    });

    document.getElementById('liveStatus').style.display = 'inline-flex';
    watchSettings();
    loadEstablishments();
    loadHappenings();
  } catch (e) {
    console.error('Init error:', e);
    document.getElementById('establishmentsList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div>Erreur de connexion. Vérifiez votre connexion internet.</div>
      </div>
    `;
  }
}

// ══ SETTINGS (MAINTENANCE MODE) ══
function watchSettings() {
  db.collection('settings').doc('global').onSnapshot(
    doc => {
      const settings = doc.exists ? doc.data() : {};
      const maintenanceEl = document.getElementById('maintenanceBanner');
      const appEl         = document.getElementById('appContent');

      if (settings.maintenanceMode) {
        maintenanceEl.classList.add('active');
        appEl.style.display = 'none';
      } else {
        maintenanceEl.classList.remove('active');
        appEl.style.display = 'block';
      }
    },
    err => console.error('Settings error:', err)
  );
}

// ══ ÉTABLISSEMENTS (TEMPS RÉEL) ══
function loadEstablishments() {
  db.collection('etablissements')
    .where('status', '==', 'active')
    .onSnapshot(
      snapshot => {
        allEstablishments = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        filterEstablishments();
      },
      err => {
        console.error('Establishments error:', err);
        document.getElementById('establishmentsList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <div>Erreur lors du chargement</div>
          </div>
        `;
      }
    );
}

// ══ HAPPENINGS (TEMPS RÉEL) ══
function loadHappenings() {
  db.collection('happenings')
    .where('status', '==', 'live')
    .onSnapshot(
      snapshot => {
        allHappenings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderHappenings();
      },
      err => console.error('Happenings error:', err)
    );
}

// ══ FILTRES ══
function filterEstablishments() {
  const search    = document.getElementById('searchInput').value.toLowerCase();
  const typeF     = document.getElementById('typeFilter').value;
  const neighF    = document.getElementById('neighborhoodFilter').value;

  const filtered = allEstablishments.filter(est => {
    const matchSearch = !search ||
      (est.nom || '').toLowerCase().includes(search) ||
      (est.description || '').toLowerCase().includes(search);
    const matchType   = !typeF  || est.type === typeF;
    const matchNeigh  = !neighF || est.quartier === neighF;
    return matchSearch && matchType && matchNeigh;
  });

  // Compteur résultats
  const count = document.getElementById('resultsCount');
  count.textContent = allEstablishments.length > 0
    ? `${filtered.length} résultat${filtered.length !== 1 ? 's' : ''}`
    : '';

  renderEstablishments(filtered);
}

// ══ RENDU ÉTABLISSEMENTS ══
function renderEstablishments(list) {
  const container = document.getElementById('establishmentsList');

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${allEstablishments.length === 0 ? '⏳' : '🏜️'}</div>
        <div>${allEstablishments.length === 0 ? 'Chargement...' : 'Aucun établissement trouvé'}</div>
      </div>
    `;
    return;
  }

  container.innerHTML = list.map((est, i) => {
    const level   = Math.max(1, Math.min(5, est.ambianceLevel || 2));
    const pct     = (level / 5) * 100;
    const emoji   = getTypeEmoji(est.type);
    const desc    = est.description ? escapeHTML(est.description) : 'Pas de description';

    return `
      <article class="card" style="animation-delay:${Math.min(i * 0.05, 0.30)}s"
        role="article" aria-label="${escapeHTML(est.nom || '')}">
        <div class="card-header">
          <div class="card-title">${escapeHTML(est.nom || 'N/A')}</div>
          <span class="card-type">${emoji} ${escapeHTML(est.type || 'N/A')}</span>
        </div>

        <div class="card-meta">
          <span class="badge">📍 ${escapeHTML(est.quartier || 'N/A')}</span>
          ${est.isLive ? `<span class="live-indicator"><span class="live-dot" aria-hidden="true"></span>EN DIRECT</span>` : ''}
        </div>

        <div class="card-desc">${desc}</div>

        <div class="ambiance-gauge" aria-label="Ambiance : ${getAmbianceLabel(level)}">
          <div class="gauge-bar" role="progressbar" aria-valuenow="${level}" aria-valuemin="1" aria-valuemax="5">
            <div class="gauge-fill" style="width:${pct}%"></div>
          </div>
          <span class="gauge-label">${getAmbianceLabel(level)}</span>
        </div>
      </article>
    `;
  }).join('');
}

// ══ RENDU HAPPENINGS ══
function renderHappenings() {
  const container = document.getElementById('happeningsList');

  if (allHappenings.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🌙</div>
        <div>Aucun happening en direct pour le moment</div>
      </div>
    `;
    return;
  }

  container.innerHTML = allHappenings.map((hap, i) => `
    <article class="card" style="animation-delay:${Math.min(i * 0.05, 0.30)}s"
      role="article" aria-label="${escapeHTML(hap.titre || 'Happening')}">
      <div class="card-header">
        <div class="card-title">${escapeHTML(hap.titre || 'Happening')}</div>
        <span class="live-indicator"><span class="live-dot" aria-hidden="true"></span>EN DIRECT</span>
      </div>
      <div class="card-meta">
        <span class="badge">📍 ${escapeHTML(hap.lieu || 'N/A')}</span>
      </div>
      <div class="card-desc">${escapeHTML(hap.description || '')}</div>
    </article>
  `).join('');
}

// ══ DÉMARRAGE ══
window.addEventListener('load', initApp);
</script>
</body>
</html>
